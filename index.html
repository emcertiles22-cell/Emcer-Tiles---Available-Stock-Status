      useEffect(() => {

      }, [stockData]);

      useEffect(() => {

      }, [masterImages]);

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date().toLocaleTimeString()), 1000);

      const toggleTheme = () => {

      const showToast = (msg, type = 'success') => {

      const downloadTextFile = (filename, content) => {
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`✅ ${filename} Downloaded successfully!`);
      };

      const getImageUrl = (itemDesc) => {
        if (!itemDesc) return null;
        const cleanDesc = itemDesc.trim().toLowerCase();
        const match = masterImages.find(img => {
          if (!img.desc) return false;
          const masterClean = img.desc.trim().toLowerCase();
          return cleanDesc === masterClean || cleanDesc.includes(masterClean) || masterClean.includes(cleanDesc);
        });
        return match ? match.url : null;
      };

      const groupedStockData = useMemo(() => {
        const map = new Map();

        stockData.forEach((item) => {
          const normDesc = (item.desc || '').trim();
          const normSize = (item.size || '').trim();
          const normSeries = (item.series || '').trim();
          const normVariant = (item.variant || '').trim();
          const normBrand = (item.brand || '').trim();
          const normItemNo = (item.itemNo || '').trim();

          // Group key combining Item Name, Size, Series, Grade/Variant, Brand & Code
          const key = `${normItemNo}||${normDesc.toLowerCase()}||${normSize}||${normSeries}||${normVariant}||${normBrand}`;

          if (!map.has(key)) {
            map.set(key, {
              groupKey: key,
              itemNo: normItemNo,
              desc: normDesc,
              size: normSize,
              series: normSeries,
              variant: normVariant,
              brand: normBrand,
              totalNetQty: 0,
              lots: [],
            });
          }

          const existing = map.get(key);
          existing.totalNetQty += Number(item.netQty) || 0;
          existing.lots.push({
            id: item.id,
            lotNo: item.lotNo || 'N/A',
            netQty: Number(item.netQty) || 0
          });
        });

        return Array.from(map.values());
      }, [stockData]);

      // Size Options
      const sizesList = useMemo(() => ['ALL', ...new Set(groupedStockData.map(i => i.size).filter(Boolean))], [groupedStockData]);

      // Dependent Series List: Shows ONLY series available for the selected size
      const seriesList = useMemo(() => {
        const relevantData = selectedSize === 'ALL' 
          ? groupedStockData 
          : groupedStockData.filter(i => i.size === selectedSize);
        return ['ALL', ...new Set(relevantData.map(i => i.series).filter(Boolean))];
      }, [groupedStockData, selectedSize]);

      // Reset selectedSeries to 'ALL' if it doesn't belong to the new size's series list
      useEffect(() => {
        if (selectedSeries !== 'ALL' && !seriesList.includes(selectedSeries)) {
          setSelectedSeries('ALL');
        }
      }, [selectedSize, seriesList, selectedSeries]);

      // Brand & Variant Dropdown Options
      const brandsList = useMemo(() => ['ALL', ...new Set(groupedStockData.map(i => i.brand).filter(Boolean))], [groupedStockData]);
      const variantsList = useMemo(() => ['ALL', ...new Set(groupedStockData.map(i => i.variant).filter(Boolean))], [groupedStockData]);

      const filteredGroupedStock = useMemo(() => {
        return groupedStockData.filter(item => {
          const matchesQuery = searchQuery === '' || 
            item.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.itemNo.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.lots.some(l => l.lotNo.toLowerCase().includes(searchQuery.toLowerCase()));

          const matchesBrand = selectedBrand === 'ALL' || item.brand === selectedBrand;
          const matchesSize = selectedSize === 'ALL' || item.size === selectedSize;
          const matchesSeries = selectedSeries === 'ALL' || item.series === selectedSeries;
          const matchesVariant = selectedVariant === 'ALL' || item.variant === selectedVariant;
          const matchesQty = item.totalNetQty >= minQty;

          return matchesQuery && matchesBrand && matchesSize && matchesSeries && matchesVariant && matchesQty;
        });
      }, [groupedStockData, searchQuery, selectedBrand, selectedSize, selectedSeries, selectedVariant, minQty]);

      // Selected items for PDF Catalog
      const selectedGroupedItems = useMemo(() => {
        return groupedStockData.filter(i => selectedItemKeys.has(i.groupKey));
      }, [groupedStockData, selectedItemKeys]);

      const toggleSelectGroup = (key) => {

        if (updated.has(key)) updated.delete(key);
        else updated.add(key);

      };

      const toggleSelectAll = () => {
        if (selectedItemKeys.size === filteredGroupedStock.length && filteredGroupedStock.length > 0) {
          setSelectedItemKeys(new Set());
        } else {
          const keys = new Set(filteredGroupedStock.map(i => i.groupKey));
          setSelectedItemKeys(keys);
        }
      };

      // Inline Lot Qty Editor
      const updateLotQty = (itemId, newQty) => {
        setStockData(prev => prev.map(item => 
          item.id === itemId ? { ...item, netQty: Math.max(0, parseInt(newQty) || 0) } : item
        ));
      };

      // Upload SS1 Stock
      const handleSS1StockUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = XLSX.read(bstr, { type: 'binary' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

            if (data.length < 2) {
              showToast('Uploaded Excel file is empty or missing headers!', 'error');
              return;
            }

            const headers = data[0].map(h => String(h || '').trim().toLowerCase());
            
            const colCommonNo = headers.findIndex(h => h.includes('common') || h.includes('item no'));
            const colSize = headers.findIndex(h => h.includes('size'));
            const colSeries = headers.findIndex(h => h.includes('series'));
            const colDesc = headers.findIndex(h => h.includes('description') || h.includes('desc') || h.includes('item descriptic'));
            const colBrand = headers.findIndex(h => h.includes('brand'));
            const colVariant = headers.findIndex(h => h.includes('variant') || h.includes('grade'));
            const colLot = headers.findIndex(h => h.includes('lot'));
            const colQty = headers.findIndex(h => h.includes('net qty') || h.includes('qty'));

            const parsedRows = [];
            for (let i = 1; i < data.length; i++) {
              const row = data[i];
              if (!row || row.length === 0) continue;

              const desc = String(row[colDesc !== -1 ? colDesc : 3] || '').trim();
              if (!desc) continue;

              parsedRows.push({
                id: `stock_${Date.now()}_${i}_${Math.random().toString(36).substr(2, 4)}`,
                itemNo: String(row[colCommonNo !== -1 ? colCommonNo : 0] || '-').trim(),
                size: String(row[colSize !== -1 ? colSize : 1] || '-').trim(),
                series: String(row[colSeries !== -1 ? colSeries : 2] || '-').trim(),
                desc: desc,
                brand: String(row[colBrand !== -1 ? colBrand : 4] || '-').trim(),
                variant: String(row[colVariant !== -1 ? colVariant : 5] || 'PRE').trim(),
                lotNo: String(row[colLot !== -1 ? colLot : 6] || '-').trim(),

                            }`}>
                              <span className="text-[9px] font-mono uppercase font-bold text-slate-400 tracking-wider block mb-1.5">
                                Lot Breakdown ({item.lots.length} Lots Merged):
                              </span>
                              <div className="flex flex-wrap gap-1.5">
                                {item.lots.map((lot) => (
                                  <div key={lot.id} className={`border px-2 py-1 rounded-lg flex items-center gap-2 text-[11px] font-mono ${
                                    theme === 'dark' ? 'bg-midnight-950 border-midnight-700' : 'bg-white border-slate-300'
                                  }`}>
                                    <span className={`font-bold ${theme === 'dark' ? 'text-slate-300' : 'text-slate-800'}`}>Lot: {lot.lotNo}</span>
                                    <input 
                                      type="number" 
                                      value={lot.netQty}
                                      onChange={(e) => updateLotQty(lot.id, e.target.value)}
                                      className={`w-12 border text-emerald-500 rounded px-1 text-right font-bold focus:outline-none ${
                                        theme === 'dark' ? 'bg-midnight-900 border-emerald-500/30' : 'bg-slate-50 border-emerald-300'
                                      }`}
                                    />
                                    <span className="text-slate-400 text-[10px]">Box</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                          </div>

                        </div>
                      );
                    })
                  )}
                </div>

              </div>
            )}

            {/* CATALOG TAB */}
            {activeTab === 'catalog' && (
              <div className="space-y-5 max-w-[1700px] mx-auto">
                {/* PDF Catalog Studio Toolbar / Controls */}
                <div className="glass-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 no-print">
                  <div>
                    <h2 className={`text-base font-extrabold flex items-center gap-2 ${theme === 'dark' ? 'text-white' : 'text-slate-900'}`}>
                      <span>📄 PDF Catalog Studio</span>
                      <span className="bg-indigo-500/15 text-indigo-500 text-xs px-2.5 py-0.5 rounded-full font-mono font-bold border border-indigo-500/30">
                        {selectedGroupedItems.length} Selected Items
                      </span>
                    </h2>
                    <p className="text-xs text-slate-400 mt-0.5">Customize client header & layout then click Print or Save as PDF</p>
                  </div>

                  <div className="flex flex-wrap items-center gap-3">
                    <button
                      onClick={() => setCatalogLayoutMode(catalogLayoutMode === 'single' ? 'grid' : 'single')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${
                        theme === 'dark' ? 'bg-midnight-800 border-midnight-700 text-slate-200' : 'bg-slate-200 border-slate-300 text-slate-800'
                      }`}
                    >
                      {catalogLayoutMode === 'single' ? '📐 Single Item per Page' : '📊 Grid Layout'}
                    </button>

                    <button
                      onClick={() => window.print()}
                      disabled={selectedGroupedItems.length === 0}
                      className="bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-extrabold px-5 py-2 rounded-xl text-xs shadow-lg glow-emerald disabled:opacity-50 transition-all flex items-center gap-2"
                    >
                      <span>🖨️ Print / Save PDF Catalog</span>
                    </button>
                  </div>
                </div>

                {/* Customer Information Bar */}
                <div className="glass-card rounded-2xl p-4 no-print">
                  <h3 className={`text-xs font-mono font-bold uppercase tracking-wider mb-3 ${theme === 'dark' ? 'text-indigo-400' : 'text-indigo-600'}`}>
                    Custom Quotation & Catalog Header Details
                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <div>
                      <label className="block text-[10px] font-mono text-slate-400 uppercase font-bold mb-1">Company / Firm Name</label>
                      <input
                        type="text"
                        value={customerInfo.companyName}
                        onChange={(e) => setCustomerInfo({ ...customerInfo, companyName: e.target.value })}
                        className={`w-full rounded-xl px-3 py-1.5 text-xs font-mono border ${
                          theme === 'dark' ? 'bg-midnight-950 border-midnight-700 text-white' : 'bg-white border-slate-300 text-slate-900'
                        }`}
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-mono text-slate-400 uppercase font-bold mb-1">Client / Project Name</label>
                      <input
                        type="text"
                        value={customerInfo.customerName}
                        onChange={(e) => setCustomerInfo({ ...customerInfo, customerName: e.target.value })}
                        className={`w-full rounded-xl px-3 py-1.5 text-xs font-mono border ${
                          theme === 'dark' ? 'bg-midnight-950 border-midnight-700 text-white' : 'bg-white border-slate-300 text-slate-900'
                        }`}
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-mono text-slate-400 uppercase font-bold mb-1">Contact Phone</label>
                      <input
                        type="text"
                        value={customerInfo.phone}
                        onChange={(e) => setCustomerInfo({ ...customerInfo, phone: e.target.value })}
                        className={`w-full rounded-xl px-3 py-1.5 text-xs font-mono border ${
                          theme === 'dark' ? 'bg-midnight-950 border-midnight-700 text-white' : 'bg-white border-slate-300 text-slate-900'
                        }`}
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-mono text-slate-400 uppercase font-bold mb-1">Date</label>
                      <input
                        type="date"
                        value={customerInfo.date}
                        onChange={(e) => setCustomerInfo({ ...customerInfo, date: e.target.value })}
                        className={`w-full rounded-xl px-3 py-1.5 text-xs font-mono border ${
                          theme === 'dark' ? 'bg-midnight-950 border-midnight-700 text-white' : 'bg-white border-slate-300 text-slate-900'
                        }`}
                      />
                    </div>
                  </div>
                </div>

                {/* Empty State vs Selected Catalog Items */}
                {selectedGroupedItems.length === 0 ? (
                  <div className="glass-card rounded-2xl p-16 text-center space-y-4 max-w-xl mx-auto">
                    <div className="text-5xl">📄</div>
                    <h3 className={`text-lg font-bold ${theme === 'dark' ? 'text-white' : 'text-slate-900'}`}>
                      No Tile Cards Selected for Catalog
                    </h3>
                    <p className="text-xs text-slate-400">
                      Select tile cards in the Stock Inventory tab to export clean catalog sheets.
                    </p>
                    <button 
                      onClick={() => setActiveTab('inventory')}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-5 py-2 rounded-xl text-xs glow-indigo"
                    >
                      Go to Stock Cards &rarr;
                    </button>
                  </div>
                ) : (
                  <div id="pdf-print-area" className="space-y-8">
                    {catalogLayoutMode === 'single' && selectedGroupedItems.map((item, index) => {
                      const imgUrl = getImageUrl(item.desc);

                      return (
                        <div 
                          key={item.groupKey} 
                          className="bg-white text-slate-900 rounded-2xl p-8 shadow-2xl border border-slate-200 max-w-4xl mx-auto page-break min-h-[980px] flex flex-col justify-between"
                        >
                          <div>
                            <div className="flex items-center justify-between pb-4 border-b-2 border-slate-900">
                              <div>
                                <h1 className="text-2xl font-black text-slate-900 uppercase tracking-tight">
                                  {customerInfo.companyName}
                                </h1>
                                <p className="text-xs font-bold text-indigo-700 mt-0.5">{customerInfo.tagline}</p>
                              </div>
                              <div className="text-right text-xs font-medium text-slate-600 space-y-0.5 font-mono">
                                <div>Ph: <strong className="text-slate-900">{customerInfo.phone}</strong></div>
                                <div>Client: <strong className="text-slate-900">{customerInfo.customerName}</strong></div>
                                <div>Date: {customerInfo.date}</div>
                                <div className="text-[10px] bg-slate-100 text-slate-800 px-2.5 py-0.5 rounded border border-slate-300 inline-block mt-1 font-bold">
                                  Page {index + 1} of {selectedGroupedItems.length}
                                </div>
                              </div>
                            </div>

                            {/* Centered High Impact Image View */}
                            <div className="my-6">
                              <div className="w-full h-[540px] bg-slate-100 rounded-2xl overflow-hidden border border-slate-300 shadow-inner flex items-center justify-center relative">
                                {imgUrl ? (
                                  <img src={imgUrl} alt={item.desc} className="w-full h-full object-cover" />
                                ) : (
                                  <div className="text-center p-8">
                                    <div className="text-6xl mb-3 text-slate-300">🖼️</div>
                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">NO PREVIEW IMAGE LINKED</p>
                                  </div>
                                )}
                                <div className="absolute bottom-4 left-4 bg-slate-950/90 text-white px-5 py-2.5 rounded-xl text-lg font-black shadow-2xl backdrop-blur-md">
                                  {item.desc}
                                </div>
                              </div>
                            </div>
                          </div>

                          {/* Technical Specifications */}
                          <div className="bg-slate-50 rounded-2xl p-5 border border-slate-300">
                            <h3 className="text-[10px] font-black uppercase tracking-widest text-indigo-900 mb-3 border-b border-slate-200 pb-1">
                              PRODUCT SPECIFICATIONS & MERGED STOCK AVAILABILITY
                            </h3>

                            <div className="grid grid-cols-4 gap-3 text-left text-xs mb-3">
                              <div className="bg-white p-3 rounded-xl border border-slate-200">
                                <span className="text-[9px] uppercase font-bold text-slate-400 block font-mono">Item Code</span>
                                <strong className="text-sm font-mono text-slate-900">{item.itemNo}</strong>
                              </div>
                              <div className="bg-white p-3 rounded-xl border border-slate-200">
                                <span className="text-[9px] uppercase font-bold text-slate-400 block font-mono">Size</span>
                                <strong className="text-sm text-slate-900">{item.size}</strong>
                              </div>
                              <div className="bg-white p-3 rounded-xl border border-slate-200">
                                <span className="text-[9px] uppercase font-bold text-slate-400 block font-mono">Series</span>
                                <strong className="text-sm text-slate-900">{item.series}</strong>
                              </div>
                              <div className="bg-white p-3 rounded-xl border border-slate-200">
                                <span className="text-[9px] uppercase font-bold text-slate-400 block font-mono">Grade/Variant</span>
                                <strong className="text-sm text-indigo-900 font-bold">{item.variant}</strong>
                              </div>
                            </div>

                            <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-300 mb-3 flex items-center justify-between">
                              <div>
                                <span className="text-[9px] uppercase font-bold text-emerald-800 block font-mono">Total Ready Net Stock</span>
                                <strong className="text-lg font-black text-emerald-800 font-mono">{item.totalNetQty} Boxes Total</strong>
                              </div>
                              <span className="text-3xl">📦</span>
                            </div>

                            <div className="bg-white p-3 rounded-xl border border-slate-200">
                              <span className="text-[9px] uppercase font-bold text-slate-400 block font-mono mb-1">Lot Numbers breakdown</span>
                              <div className="flex flex-wrap gap-2 text-xs font-mono">
                                {item.lots.map(l => (
                                  <span key={l.id} className="bg-slate-100 text-slate-800 px-2.5 py-1 rounded border border-slate-300">
                                    Lot {l.lotNo}: <strong>{l.netQty} Box</strong>
                                  </span>
                                ))}
                              </div>
                            </div>

                            {/* Catalog Footer with Yashdeep Jivani Signature */}
                            <div className="mt-4 pt-3 border-t border-slate-200 flex justify-between items-center text-[10px] text-slate-500 font-mono">
                              <span>* Stock subject to prior sale.</span>
                              <span className="font-bold text-slate-800">
                                Designed & Developed by - <span className="text-indigo-600 font-black">Yashdeep Jivani</span>
                              </span>
                            </div>
                          </div>

                        </div>
                      );
                    })}
                  </div>
                )}

              </div>
            )}

            {/* TAB 3 & 4 remain clean ... */}
            {activeTab === 'master' && (
              <div className="space-y-5 max-w-[1700px] mx-auto">
                <div className="glass-card rounded-2xl p-4 flex items-center justify-between">
                  <div>
                    <h2 className="text-sm font-bold text-white flex items-center gap-2">
                      <span>🖼️ Master Design Name & Image Link Database</span>
                      <span className="bg-cyan-500/10 text-cyan-400 text-xs px-2.5 py-0.5 rounded-full font-mono border border-cyan-500/30">
                        {masterImages.length} Linked Images
                      </span>
                    </h2>
                  </div>

                  <label className="cursor-pointer bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition-all shadow-md inline-block">
                    + Upload SS2 Excel File
                    <input type="file" accept=".xlsx, .xls, .csv" onChange={handleSS2MasterImageUpload} className="hidden" />
                  </label>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3.5">
                  {masterImages.map((img, idx) => (
                    <div key={idx} className="glass-card rounded-2xl overflow-hidden shadow group hover:border-cyan-500/40 transition-all">
                      <div className="h-44 bg-midnight-950 relative overflow-hidden cursor-pointer" onClick={() => setLightboxImage({ url: img.url, title: img.desc })}>
                        <img src={img.url} alt={img.desc} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300" />
                      </div>
                      <div className="p-3">
                        <h4 className="font-bold text-white text-xs truncate">{img.desc}</h4>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'setup' && (
              <div className="glass-card rounded-2xl p-6 max-w-4xl mx-auto shadow-2xl space-y-6 border border-midnight-700">
                <div className="border-b border-midnight-700 pb-4">
                  <span className="text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-mono">
                    ⚡ One-Click Desktop Setup
                  </span>
                  <h2 className="text-xl font-black text-white mt-3">Run Tile Master ERP Desktop Application</h2>
                </div>
                {/* Download buttons */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 font-mono text-[11px]">
                  <button onClick={() => downloadTextFile('index.html', document.documentElement.outerHTML)} className="bg-indigo-600 p-3 rounded-xl text-white font-bold text-left">
                    📥 Download index.html
                  </button>
                  <button onClick={() => downloadTextFile('package.json', PACKAGE_JSON_CONTENT)} className="bg-indigo-600 p-3 rounded-xl text-white font-bold text-left">
                    📥 Download package.json
                  </button>
                  <button onClick={() => downloadTextFile('main.js', MAIN_JS_CONTENT)} className="bg-indigo-600 p-3 rounded-xl text-white font-bold text-left">
                    📥 Download main.js
                  </button>
                  <button onClick={() => downloadTextFile('setup.bat', SETUP_BAT_CONTENT)} className="bg-emerald-600 p-3 rounded-xl text-white font-bold text-left">
                    🚀 Download setup.bat
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* Footer Bar */}
          <footer className={`px-5 py-2.5 text-center text-xs font-mono no-print flex items-center justify-between border-t transition-colors ${
            theme === 'dark' ? 'bg-midnight-900 border-midnight-800 text-slate-400' : 'bg-white border-slate-200 text-slate-600'
          }`}>
            <span className="text-[11px]">Tile Master ERP Workstation v3.0</span>
            <div className="flex items-center gap-2">
              <span className="text-[11px]">Designed & Developed by -</span>
              <span className="font-extrabold bg-gradient-to-r from-cyan-500 via-indigo-500 to-rose-500 bg-clip-text text-transparent animate-pulse tracking-wide font-mono text-xs">
                Yashdeep Jivani
              </span>
            </div>
            <span className="text-emerald-500 text-[11px]">Theme Mode: {theme.toUpperCase()}</span>
          </footer>

          {/* LIGHTBOX PREVIEW MODAL */}
          {lightboxImage && (
            <div 
              className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4"
              onClick={() => setLightboxImage(null)}
            >
              <div className={`max-w-3xl w-full border rounded-2xl overflow-hidden shadow-2xl ${
                theme === 'dark' ? 'bg-midnight-900 border-midnight-700' : 'bg-white border-slate-300'
              }`}>
                <div className="p-3.5 border-b flex items-center justify-between">
                  <h3 className={`font-bold text-sm ${theme === 'dark' ? 'text-white' : 'text-slate-900'}`}>{lightboxImage.title}</h3>
                  <button onClick={() => setLightboxImage(null)} className="text-slate-400 hover:text-red-500 text-lg font-bold px-2">✕</button>
                </div>
                <div className={`p-3 h-[520px] flex items-center justify-center ${theme === 'dark' ? 'bg-midnight-950' : 'bg-slate-100'}`}>
                  <img src={lightboxImage.url} alt={lightboxImage.title} className="max-h-full max-w-full object-contain rounded-xl shadow-lg" />
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body></html>
